<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Transcriber</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <h1>WhatsApp Transcriber</h1>
            <p class="muted">Notes vocales → texte, en local avec Whisper.</p>
        </header>

        <section class="upload">
            <label id="dropzone" class="dropzone">
                <input type="file" id="fileInput" multiple accept="audio/*,.ogg,.opus,.wav,.mp3,.m4a">
                <strong>Dépose tes notes vocales ici</strong>
                <span class="muted">ou clique pour choisir · .ogg .opus .mp3 .m4a .wav</span>
            </label>

            <ul id="queue" class="queue"></ul>

            <div class="controls">
                <label>
                    Modèle
                    <select id="modelSelect">
                        <option value="tiny">tiny (très rapide)</option>
                        <option value="base">base</option>
                        <option value="small" selected>small (conseillé)</option>
                        <option value="medium">medium (plus précis, lent)</option>
                    </select>
                </label>
                <label>
                    Langue
                    <select id="languageSelect">
                        <option value="fr" selected>Français</option>
                        <option value="en">Anglais</option>
                        <option value="auto">Détection auto</option>
                    </select>
                </label>
                <button id="transcribeBtn" class="primary" disabled>Transcrire</button>
            </div>
        </section>

        <section>
            <div class="history-head">
                <h2>Historique</h2>
                <input type="search" id="searchInput" placeholder="Rechercher…">
            </div>
            <p id="emptyState" class="muted empty">Aucune transcription pour l'instant.</p>
            <ol id="resultsList" class="results"></ol>
        </section>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <template id="itemTemplate">
        <li class="item">
            <div class="item-head">
                <div>
                    <h3 class="filename"></h3>
                    <p class="meta muted"></p>
                </div>
                <div class="actions">
                    <button data-action="copy">Copier</button>
                    <a data-export="txt">.txt</a>
                    <a data-export="md">.md</a>
                    <button data-action="delete" class="danger">Supprimer</button>
                </div>
            </div>
            <audio controls preload="none"></audio>
            <p class="text"></p>
            <details>
                <summary>Horodatage</summary>
                <ul class="segments"></ul>
            </details>
        </li>
    </template>

    <script src="app.js"></script>
</body>
</html>
